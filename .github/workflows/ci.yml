name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: test "$(uname -s)" = Linux && python3 --version && node --version && pnpm --version
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
        timeout-minutes: 26
      - run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
  pi-loader-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: test "$(uname -s)" = Linux && python3 --version && node --version && pnpm --version
      - run: pnpm install --frozen-lockfile --prod=false
      - run: python3 scripts/test-supervisor.py suite -- node --experimental-strip-types --no-warnings scripts/test-runner.ts test/research-mcp-loader.test.ts
        timeout-minutes: 13
